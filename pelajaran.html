const lessons={
pion:{world:"DESA PION",piece:"♙",title:"Kenali sang pion",intro:"Bidang kecil dengan peran besar. Pion membuka jalan dan dapat berubah menjadi bidak kuat.",heading:"Cara pion bergerak",body:"<p>Pion putih bergerak ke arah atas papan. Dari posisi awal ia boleh maju satu atau dua kotak. Setelah itu hanya satu kotak.</p><ul><li>Pion bergerak lurus ke depan.</li><li>Pion menangkap lawan satu kotak secara diagonal.</li><li>Jika mencapai baris terakhir, pion dapat promosi menjadi ratu atau bidak lain.</li></ul>",pieceAt:52,targets:[44,36],question:"Bagaimana pion menangkap bidak lawan?",options:["Lurus ke depan","Satu kotak secara diagonal","Seperti huruf L"],answer:1},
kuda:{world:"HUTAN KUDA",piece:"♘",title:"Lompatan berbentuk L",intro:"Kuda adalah satu-satunya bidak yang dapat melompati bidak lain.",heading:"Dua kotak lalu berbelok",body:"<p>Gerakan kuda membentuk huruf L: dua kotak ke satu arah lalu satu kotak ke samping. Warna kotak tempat kuda berhenti selalu berbeda dari warna awalnya.</p><ul><li>Kuda kuat di tengah papan.</li><li>Kuda dapat menyerang raja dan ratu sekaligus—disebut garpu.</li><li>Kuda di sudut hanya memiliki sedikit pilihan.</li></ul>",pieceAt:57,targets:[40,42,51],question:"Apa keistimewaan kuda?",options:["Bisa melompati bidak","Selalu bergerak diagonal","Tidak dapat menangkap"],answer:0},
benteng:{world:"MENARA BENTENG",piece:"♖",title:"Kuasai garis lurus",intro:"Benteng bergerak jauh secara horizontal dan vertikal selama jalurnya kosong.",heading:"Buka jalur untuk benteng",body:"<p>Benteng sangat kuat di lajur terbuka. Dua benteng yang saling melindungi dapat menguasai satu baris atau lajur.</p><ul><li>Benteng tidak dapat melompati bidak.</li><li>Benteng terlibat dalam gerakan istimewa rokade.</li><li>Simpan benteng untuk permainan akhir.</li></ul>",pieceAt:56,targets:[48,40,32,24,16,8,0,57,58],question:"Benteng bergerak ke arah mana?",options:["Lurus horizontal atau vertikal","Hanya diagonal","Seperti huruf L"],answer:0},
gajah:{world:"LEMBAH GAJAH",piece:"♗",title:"Jaga diagonal panjang",intro:"Gajah meluncur secara diagonal dan tetap berada pada warna kotak yang sama sepanjang permainan.",heading:"Melihat dari kejauhan",body:"<p>Gajah membutuhkan diagonal yang terbuka. Hindari mengurung gajah di belakang pion sendiri terlalu lama.</p><ul><li>Gajah tidak dapat melompati bidak.</li><li>Sepasang gajah menguasai kotak terang dan gelap.</li><li>Gajah unggul di papan yang terbuka.</li></ul>",pieceAt:58,targets:[49,40,51,44,37,30,23],question:"Gajah dari kotak terang akan tetap berada di…",options:["Kotak gelap","Kotak terang","Warna apa saja"],answer:1},
ratu:{world:"KERAJAAN RATU",piece:"♕",title:"Kekuatan harus dijaga",intro:"Ratu menggabungkan gerakan benteng dan gajah, tetapi jangan mengeluarkannya terlalu cepat.",heading:"Bidak terkuat di papan",body:"<p>Ratu bisa bergerak lurus maupun diagonal sejauh jalurnya kosong. Nilainya tinggi sehingga serangan kecil pada ratu sering membuang waktu.</p><ul><li>Jangan berburu pion dengan ratu di awal permainan.</li><li>Pastikan ratu memiliki kotak aman.</li><li>Gunakan ratu bersama bidak lain untuk menyerang.</li></ul>",pieceAt:59,targets:[51,43,35,27,19,11,3,50,41,32,52,45,38,31],question:"Mengapa ratu sebaiknya tidak keluar terlalu cepat?",options:["Ratu tidak bisa menangkap","Lawan dapat menyerangnya sambil mengembangkan bidak","Ratu hanya berguna di sudut"],answer:1},
raja:{world:"ISTANA RAJA",piece:"♔",title:"Lindungi rajamu",intro:"Tujuan catur adalah membuat raja lawan skakmat sambil menjaga rajamu sendiri.",heading:"Skak bukan selalu skakmat",body:"<p>Saat skak, ancaman masih dapat diatasi dengan memindahkan raja, menangkap penyerang, atau menutup jalur serangan. Skakmat terjadi saat tidak ada satu pun jawaban legal.</p><ul><li>Lakukan rokade lebih awal jika aman.</li><li>Jangan membuka pion di depan raja tanpa alasan.</li><li>Dalam permainan akhir, raja menjadi bidak yang aktif.</li></ul>",pieceAt:60,targets:[51,52,53,59,61],question:"Kapan permainan berakhir dengan skakmat?",options:["Saat raja diserang dan tidak punya langkah penyelamat","Setiap kali raja diserang","Saat ratu tertangkap"],answer:0}
